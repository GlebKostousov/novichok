name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.6
          make install
      - name: Check and build
        run: |
          make check
          make test
          make test-delivery
          make build
      - name: Browser tests
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          cd ../backend
          uv run alembic upgrade head
          NOVICHOK_STATIC_DIR=../frontend/dist uv run uvicorn app.app_factory:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/novichok.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/novichok.log
            exit 1
          fi
          cd ../frontend
          npm run test:e2e
